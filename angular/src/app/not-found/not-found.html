<div class="not-found">

        <svg class="graphic" viewBox="0 0 64 64" aria-hidden="true" role="img">
            <g fill="none" stroke="var(--link)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 46a12 12 0 0 1 0-17l6-6" />
                <path d="M46 18a12 12 0 0 1 0 17l-6 6" />

        <h1 class="code">404</h1>
