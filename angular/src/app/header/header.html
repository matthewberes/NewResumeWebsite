<div class="flex">
    <a class="header" href="/">Matthew Beres</a>
    <button class="menu-toggle" aria-label="Toggle menu" (click)="toggleMenu()" [attr.aria-expanded]="mobileMenuOpen">
        <span class="hamburger"></span>
    </button>
    <div class="nav-links" [class.open]="mobileMenuOpen">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()">Home</a>
        <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
        <a routerLink="/resume" routerLinkActive="active" (click)="closeMenu()">Resume</a>
    </div>
</div>
